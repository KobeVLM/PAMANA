name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --legacy-peer-deps: eslint-plugin-jsx-a11y declares peer support up to
      # ESLint 9 while the project uses ESLint 10; the plugin runs fine there.
      - run: npm ci --legacy-peer-deps
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (Maven tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp test
