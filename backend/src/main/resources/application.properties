# Server Configuration
server.port=${PORT:8080}

# Supabase PostgreSQL Configuration (using IPv4 Connection Pooler for compatibility)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA and Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Schema migrations (Flyway). An existing database is baselined at version 0
# and subsequent migrations under classpath:db/migration are applied.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT Configuration Secrets
# A secure 512-bit HS512 hex key for dev auth token validation
pamana.jwt.secret=${JWT_SECRET}
pamana.jwt.expirationMs=86400000
