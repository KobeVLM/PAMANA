# Server Configuration
server.port=${PORT:8080}

# Supabase PostgreSQL Configuration (using IPv4 Connection Pooler for compatibility)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2

# JPA and Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration Secrets
# A secure 512-bit HS512 hex key for dev auth token validation
pamana.jwt.secret=${JWT_SECRET}
pamana.jwt.expirationMs=86400000
