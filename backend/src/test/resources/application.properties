# H2 In-Memory Database Configuration for Test Profile
spring.datasource.url=jdbc:h2:mem:pamana_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configurations for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Token Configurations for Testing
pamana.jwt.secret=${JWT_SECRET}
pamana.jwt.expirationMs=3600000
